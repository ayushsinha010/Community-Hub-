{% extends "base.html" %}
{% block title %}Create account — AI Hub{% endblock %}
{% block content %}
<div class="login-screen">
  <div class="login-card">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="AI Hub" class="login-logo">
    <h1 class="login-heading">AI Hub</h1>
    <p class="login-subheading">Create your account</p>
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <form method="post" class="login-form">
      <label class="field-label" for="display_name">Your name</label>
      <input type="text" id="display_name" name="display_name" required autofocus>
      <label class="field-label" for="department">Department</label>
      <input type="text" id="department" name="department" list="department-list" placeholder="e.g. Engineering, Sales, HR" required>
      <datalist id="department-list">
        {% for d in departments %}<option value="{{ d }}">{% endfor %}
      </datalist>
      <label class="field-label" for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="username" required>
      <label class="field-label" for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required minlength="6">
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>
    <p class="field-hint-small login-switch">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
  </div>
</div>
{% endblock %}
