{% extends "base.html" %}
{% block title %}Sign in — AI Hub{% endblock %}
{% block content %}
<div class="login-screen">
  <div class="login-card">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="AI Hub" class="login-logo">
    <h1 class="login-heading">AI Hub</h1>
    <p class="login-subheading">Sign in to continue</p>
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <form method="post" class="login-form">
      <label class="field-label" for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username" required autofocus>
      <label class="field-label" for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
    <p class="field-hint-small login-switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
